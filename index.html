<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff2dd" />
    <meta
      name="description"
      content="I画创，专注、清晰的多用户 AI 图片创作工作台。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>I画创</title>
    <script src="./config.js"></script>
    <script>
      ;(() => {
        const preference = localStorage.getItem('lighttable-theme') || 'system'
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = preference === 'system' ? (dark ? 'dark' : 'light') : preference
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
