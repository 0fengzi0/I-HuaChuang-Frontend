name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build Pages site
        run: npm run build:pages
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployment
        run: |
          base_url="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 12); do
            if curl -fsSL "$base_url" | grep -qi "I画创" &&
               curl -fsSL "${base_url%/}/app/" | grep -q 'id="app"' &&
               curl -fsSL "${base_url%/}/app/config.js" | grep -q 'demoMode: true'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
